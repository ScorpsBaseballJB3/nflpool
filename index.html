<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NFL Pool</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NFL Pool">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--acc:#f2b705;--nav:#0f172a;
--fav:#2563eb;--favbg:#dbeafe;--dog:#16a34a;--dogbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--ink:#e5e9f0;--mute:#94a3b8;--line:#22304a;--favbg:#172554;--dogbg:#0f2e1c;--badbg:#3b1111}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior-y:contain}
header{position:sticky;top:0;z-index:5;background:var(--nav);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header h1{margin:0;font-size:20px;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}header small{color:#cbd5e1}
.seg{display:inline-flex;background:#1e293b;border-radius:10px;padding:3px;gap:2px}.seg button{border:0;background:none;color:#cbd5e1;font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px}.seg button.on{background:var(--acc);color:#111}
#ptr{text-align:center;color:var(--mute);font-size:13px;height:0;overflow:hidden;transition:height .15s}
main{padding:12px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;background:none;border:0;color:#94a3b8;font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}nav button span{font-size:20px}nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}.card h2{margin:0 0 8px;font-size:17px}.mute{color:var(--mute);font-size:13px}
.pick{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.pick:last-child{border:0}
.num{min-width:34px;height:34px;border-radius:50%;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.pt{flex:1;min-width:0}.pt b{font-size:16px}.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:6px;white-space:nowrap}
.EDGE{background:#fef3c7;color:#92400e}.RULE{background:#e0e7ff;color:#3730a3}.FLIP{background:#dcfce7;color:#166534}.EDIT{background:#fce7f3;color:#9d174d}
.st{font-size:13px;font-weight:700;text-align:right;min-width:80px}.cov{color:var(--dog)}.not{color:var(--bad)}.pend{color:var(--mute)}
.mv{font-size:12px;font-weight:700;margin-top:2px}.up{color:var(--dog)}.dn{color:var(--bad)}.eq{color:var(--mute)}
.sit{margin-top:4px}.sit .flag{font-size:11px}.flag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:1px 6px;margin:3px 4px 0 0}
.sw{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font-size:12px;padding:5px 8px;margin-top:6px}
.score{font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}td{padding:8px 4px;border-bottom:1px solid var(--line)}td.c,th.c{text-align:center}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--fav)}
.do{font-weight:700;font-size:13px}.dofav{color:var(--fav)}.dodog{color:var(--dog)}.doflip{color:var(--mute)}
.big{display:flex;gap:10px}.big div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center}.big b{display:block;font-size:24px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:700}.cf{background:var(--favbg);color:var(--fav)}.cd{background:var(--dogbg);color:var(--dog)}
.ok{color:var(--dog);font-weight:700}.x{color:var(--bad);font-weight:700}.hide{display:none!important}svg text{fill:var(--mute);font-size:10px}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:12px}.legend i{width:14px;height:3px;display:inline-block}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--nav);color:#fff;margin:4px 6px 0 0}.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.meter{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--dog),var(--acc))}

.opts{display:flex;gap:8px;margin-top:8px}.opt{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 6px;font-size:15px;font-weight:700;text-align:center;position:relative}
.opt.sel{border-color:var(--acc);background:var(--acc);color:#111}.opt small{display:block;font-weight:500;font-size:11px;opacity:.8}.opt .star{position:absolute;top:-8px;right:-6px;font-size:16px}
.fillbar{position:sticky;top:calc(env(safe-area-inset-top) + 64px);z-index:4}.tb{width:90px;font-size:20px;font-weight:700;text-align:center;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.recap{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;border:0}.recap .mute{color:#cbd5e1}.recap b.n{font-size:40px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#modal img{max-width:100%;max-height:70vh;border-radius:8px;background:#fff}
</style>
</head>
<body>
<header><h1><span>🏈 NFL POOL</span><span class="seg" id="who"><button data-w="BROOKS">Brooks</button><button data-w="STELLA">Stella</button></span></h1><small id="sub">2026</small></header>
<div id="ptr">↓ Release to refresh</div>
<main id="main">
<section id="week"></section><section id="live" class="hide"></section><section id="trends" class="hide"></section>
<section id="teams" class="hide"></section><section id="race" class="hide"></section><section id="history" class="hide"></section>
</main>
<div id="modal" class="hide"></div>
<nav>
<button data-t="week" class="on"><span>📋</span>This Week</button><button data-t="live"><span>📡</span>Live</button><button data-t="trends"><span>📊</span>Trends</button>
<button data-t="teams"><span>🔎</span>Teams</button><button data-t="race"><span>🏁</span>Race</button><button data-t="history"><span>🗂️</span>History</button>
</nav>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ESPN={WAS:'WSH'},esp=a=>ESPN[a]||a,TABS=['week','live','trends','teams','race','history'];
let G=[],W=null,S=null,who=LS.get('who','BROOKS'),tab=LS.get('tab','week'),liveTimer=null,liveBoth=LS.get('liveBoth',false);
function csv(t){const L=t.trim().split(/\r?\n/),h=L[0].split(',');return L.slice(1).map(l=>{const v=l.split(',');const o={};h.forEach((k,i)=>o[k]=v[i]||'');return o})}
const bucket=x=>x<=2.5?'2.5 or less':x<=4.5?'3.5–4.5':x<=7.5?'5.5–7.5':x<=10.5?'8–10.5':'11+';
const ADV={'2.5 or less':['Coin flip — edge only, else road team','doflip'],'3.5–4.5':['TAKE THE FAVORITE','dofav'],'5.5–7.5':['TAKE THE DOG (road dog best)','dodog'],'8–10.5':['TAKE THE FAVORITE','dofav'],'11+':['Coin flip — edge only','doflip']};
const done=g=>g.result==='fav covered'||g.result==='dog covered';
const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–',nm=w=>w==='BROOKS'?'Brooks':'Stella';
const wkRows=()=>G.filter(g=>+g.week===W.week).sort((a,b)=>a.fav_num-b.fav_num);

/* ---------- picks (official + phone edits) ---------- */
function official(w){const nums=w==='BROOKS'?W.picks.map(p=>p.num):(W.stella?W.stella.picks:[]);const o={};
 for(const g of wkRows()){const f=+g.fav_num;if(nums.includes(f))o[f]='fav';else if(nums.includes(f+1))o[f]='dog'}return o}
const ekey=w=>`edits-${W.week}-${w}`;
const isLocked=()=>!!(W.locked||(W.lockAt&&Date.now()>=Date.parse(W.lockAt)));
const fkey=w=>`fill-${W.week}-${w}`,fillOn=w=>{if(isLocked())return null;const x=LS.get(fkey(w),null);return x&&Object.keys(x.s||{}).length?x:null};
function card(w){const off=official(w),fl=fillOn(w),ed=fl?fl.s:(isLocked()?{}:LS.get(ekey(w),{})),out=[];
 for(const g of wkRows()){const f=+g.fav_num,side=fl?ed[f]:(ed[f]||off[f]);if(!side)continue;
  const fav=side==='fav',num=fav?f:f+1,meta=w==='BROOKS'?(W.picks.find(p=>p.num===num)||{}):{};
  const edited=ed[f]&&ed[f]!==off[f];
  out.push({f,side,num,team:fav?g.favorite:g.underdog,opp:fav?g.underdog:g.favorite,fav:g.favorite,dog:g.underdog,line:+g.pool_line,
   home:g.home,mkt:g.market_line_sunday?+g.market_line_sunday:null,tag:edited?'EDIT':(meta.tag||''),why:edited?'Changed on your phone':(meta.why||''),flags:meta.flags||[],g})}
 return out}
function flip(w,f){if(isLocked())return;const fl=fillOn(w);if(fl){fl.s[f]=fl.s[f]==='fav'?'dog':'fav';LS.set(fkey(w),fl);renderWeek();return}const off=official(w),ed=LS.get(ekey(w),{}),cur=ed[f]||off[f];const nx=cur==='fav'?'dog':'fav';
 if(nx===off[f])delete ed[f];else ed[f]=nx;LS.set(ekey(w),ed);renderWeek()}
const tieb=w=>{const x=isLocked()?null:LS.get(fkey(w),null);if(x&&x.tb!==''&&x.tb!=null)return x.tb;return w==='BROOKS'?W.tiebreaker:(W.stella?W.stella.tiebreaker:'')};
const won=p=>done(p.g)?((p.g.result==='fav covered')===(p.side==='fav')):null;
const lineTxt=p=>(p.side==='fav'?'-':'+')+p.line;
function moveTxt(p){if(p.mkt==null)return'';const e=p.side==='fav'?p.mkt-p.line:p.line-p.mkt;const m=(p.side==='fav'?'-':'+')+p.mkt;
 if(e>0)return`<div class="mv up">▲ Market ${m} · you get ${e} pt${e===1?'':'s'}</div>`;if(e<0)return`<div class="mv dn">▼ Market ${m} · ${-e} worse than market</div>`;return`<div class="mv eq">= Market ${m}</div>`}

/* ---------- header / nav / gestures ---------- */
function setWho(w){who=w;LS.set('who',w);$$('#who button').forEach(b=>b.classList.toggle('on',b.dataset.w===w));renderWeek();renderHistory();if(tab==='live')loadLive()}
$$('#who button').forEach(b=>b.onclick=()=>setWho(b.dataset.w));
function go(t){tab=t;LS.set('tab',t);$$('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));$$('main section').forEach(s=>s.classList.add('hide'));$('#'+t).classList.remove('hide');window.scrollTo(0,0);if(t==='live')loadLive();else clearTimeout(liveTimer)}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
let tx=0,ty=0,pull=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;pull=0},{passive:true});
document.addEventListener('touchmove',e=>{const dy=e.touches[0].clientY-ty;if(window.scrollY<=0&&dy>0&&Math.abs(dy)>Math.abs(e.touches[0].clientX-tx)){pull=dy;$('#ptr').style.height=Math.min(dy/2,40)+'px';$('#ptr').textContent=dy>110?'↻ Release to refresh':'↓ Pull to refresh'}},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(pull>110){$('#ptr').textContent='Refreshing…';load().then(()=>{$('#ptr').style.height=0})}else $('#ptr').style.height=0;
 if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5&&!e.target.closest('table,select,svg,#modal')){const i=TABS.indexOf(tab)+(dx<0?1:-1);if(i>=0&&i<TABS.length)go(TABS[i])}});

/* ---------- data ---------- */
async function load(){const v='?v='+Date.now();
 const [g,w,s]=await Promise.all([fetch('data/games.csv'+v).then(r=>r.text()),fetch('data/week.json'+v).then(r=>r.json()),fetch('data/standings.json'+v).then(r=>r.json())]);
 G=csv(g);W=w;S=s;$('#sub').textContent=W.title;setWho(who);renderTrends();renderTeams();renderRace();if(tab==='live')loadLive()}

/* ---------- This Week ---------- */
let fillMode=false;
/* ---------- situation flags (10-season backtest 2016–25, closing lines) ---------- */
const DIVS=[['BUF','MIA','NE','NYJ'],['BAL','CIN','CLE','PIT'],['HOU','IND','JAX','JAC','TEN'],['DEN','KC','LV','LAC'],['DAL','NYG','PHI','WAS','WSH'],['CHI','DET','GB','MIN'],['ATL','CAR','NO','TB'],['ARI','LAR','LA','SEA','SF']];
const divOf=t=>DIVS.findIndex(d=>d.includes(t));
const SPB=[[0,1,'Road team 53% · coin flip'],[1.5,1.5,'Road team 54%'],[2,2,'Home team 60% (small sample)'],[2.5,2.5,'Road team 55%'],[3,3,'Dogs 51% · coin flip'],[3.5,4.5,'Dogs 52% · coin flip'],[5.5,7.5,'Dogs 51% · coin flip'],[8,10.5,'Dogs 54%'],[11,12.5,'Favs 68% ✅'],[13,14.5,'Dogs 56%'],[15,99,'Coin flip']];
function sit(g){const L=+g.pool_line,T=parseFloat(g.total),M=g.market_line_sunday!==''&&g.market_line_sunday!=null?+g.market_line_sunday:null,wk=+g.week,out=[];
 const b=SPB.find(x=>L>=x[0]&&L<=x[1]);out.push(`📏 ${L} pts → ${b?b[2]:'—'}`);
 out.push(g.home==='dog'?`🏠 Home dog (${g.underdog})`:g.home==='fav'?`✈️ Road dog (${g.underdog})`:'🏟️ Neutral site');
 if(divOf(g.favorite)>=0&&divOf(g.favorite)===divOf(g.underdog))out.push('🤝 Division → dogs 52%');
 if(T)out.push(`Σ Total ${T} → ${T<=40?'favs 52%':T<=45?'dogs 53%':'no lean'}`);
 if(M!=null){const d=M-L,crossF=(L<3&&M>=3)||(L<7&&M>=7),crossD=(M<=3&&L>3)||(M<=7&&L>7);
  if(d===0)out.push('💰 No edge (market = pool)');else{const side=d>0?`${g.favorite} -${L}`:`${g.underdog} +${L}`,strong=Math.abs(d)>=1||(d>0?crossF:crossD);out.push(`💰 ${strong?'STRONG':'Small'} edge: ${side} (mkt ${M})`)}}
 if([2.5,3.5,6.5,7.5].includes(L))out.push(`🔑 Hook on the ${L<5?3:7}`);
 if(wk>=15)out.push('📅 Late season');
 return out.map(t=>`<span class="flag">${t}</span>`).join('')}
function renderWeek(){if(fillMode&&isLocked())fillMode=false;if(fillMode)return renderFill();const C=card(who),R=wkRows();const ed=Object.keys(LS.get(ekey(who),{})).length;
 let h=recapHTML(C,R);
 const wins=C.filter(p=>won(p)===true).length,loss=C.filter(p=>won(p)===false).length;
 h+=`<div class="card"><h2>${nm(who)} · ${W.title}</h2><div class="mute">${W.note||''}</div>
 <div class="big" style="margin-top:10px"><div><span class="mute">Record</span><b>${wins}-${loss}</b></div><div><span class="mute">Tiebreaker</span><b>${tieb(who)||'–'}</b></div><div><span class="mute">Edges</span><b>${C.filter(p=>p.mkt!=null&&(p.side==='fav'?p.mkt-p.line:p.line-p.mkt)>0).length}</b></div></div>${tbHelp(false)}
 ${isLocked()?'<span class="btn alt" style="cursor:default">🔒 Picks locked</span>':'<button class="btn" style="background:var(--acc);color:#111" onclick="fillMode=true;renderWeek();scrollTo(0,0)">✏️ Fill out my sheet</button>'}<button class="btn" onclick="showSheet()">🖨️ Printable sheet</button>${fillOn(who)?'<span class="mute" style="display:block;margin-top:6px">Showing the picks you filled out.</span>':''}${!isLocked()&&!fillOn(who)&&ed?`<button class="btn alt" onclick="resetEdits()">↺ Reset ${ed} change${ed>1?'s':''}</button>`:''}</div><div class="card"><h2>Card</h2><div class="mute">${isLocked()?'🔒 Locked — these are the picks turned in.':'Tap ↔ to switch a pick (saved on this phone).'}</div>`;
 for(const p of C){const r=won(p);const st=r===true?'<span class="cov">✓ WIN</span>':r===false?'<span class="not">✗ LOSS</span>':'<span class="pend">—</span>';
  const sc=p.g.fav_score?`<div class="score">${p.fav} ${p.g.fav_score} – ${p.dog} ${p.g.dog_score}</div>`:'';
  h+=`<div class="pick"><div class="num">${p.num}</div><div class="pt"><b>${p.team} ${lineTxt(p)}</b> <span class="mute">${p.home==='neutral'?'vs':(p.home===p.side?'vs':'@')} ${p.opp}</span>${p.tag?`<span class="tag ${p.tag}">${p.tag}</span>`:''}
  ${p.why?`<div class="mute">${p.why}</div>`:''}${moveTxt(p)}${p.flags.map(f=>`<span class="flag">${f}</span>`).join('')}<div class="sit">${sit(p.g)}</div>${sc}
  ${done(p.g)||isLocked()?'':`<button class="sw" onclick="flip('${who}',${p.f})">↔ Switch to ${p.side==='fav'?p.dog+' +'+p.line:p.fav+' -'+p.line}</button>`}</div><div class="st">${st}</div></div>`}
 if(!C.length)h+='<div class="mute">No picks loaded for this week yet.</div>';
 h+='</div>';if(who==='BROOKS'&&W.recheck&&W.recheck.length)h+=`<div class="card"><h2>⚠️ Recheck Sunday 11:30</h2>${W.recheck.map(r=>'<div>• '+r+'</div>').join('')}</div>`;
 $('#week').innerHTML=h}
function resetEdits(){LS.set(ekey(who),{});renderWeek()}
/* ---------- Fill out my sheet ---------- */
function getFill(){return LS.get(fkey(who),{s:{},tb:''})}
function setPick(f,side){const x=getFill();x.s[f]=side;LS.set(fkey(who),x);renderFill(true)}
function setTb(v){const x=getFill();x.tb=v===''?'':+v;LS.set(fkey(who),x);const c=$('#fcount');if(c)c.innerHTML=fillCount()}
function useClaude(){const off=official('BROOKS'),x=getFill();x.s={...off};if(x.tb==='')x.tb=W.tiebreaker;LS.set(fkey(who),x);renderFill()}
function clearFill(){LS.set(fkey(who),{s:{},tb:''});renderFill()}
function fillCount(){const x=getFill(),n=wkRows().length,k=Object.keys(x.s).length;return `<b>${k} of ${n}</b> picked${x.tb===''?' · <span class="x">tiebreaker missing</span>':' · tiebreaker '+x.tb}${k===n&&x.tb!==''?' <span class="ok">✓ complete</span>':''}`}
function copyForClaude(){const C=card(who);const t=`Week ${W.week} ${nm(who)} picks: ${C.map(p=>p.num).join(', ')}. Tiebreaker ${tieb(who)}.`;
 (navigator.share?navigator.share({text:t}):navigator.clipboard.writeText(t).then(()=>alertMsg('Copied — paste it to Claude'))).catch(()=>{})}
function mnfInfo(){const R=wkRows();if(!R.length)return null;const g=R[R.length-1],T=parseFloat(g.total);if(!T)return null;
 const C=[30,33,34,37,38,41,43,44,47,48,51,54,55,58,61];let best=C[0];C.forEach(c=>{if(Math.abs(c-T)<Math.abs(best-T)||(Math.abs(c-T)===Math.abs(best-T)&&c>best))best=c});
 if(Math.abs(best-T)>3)best=Math.round(T)%5===0?Math.round(T)+1:Math.round(T);if(W.tiebreaker)best=+W.tiebreaker;
 return {game:`${g.underdog_is_home||''}`,fav:g.favorite,dog:g.underdog,home:g.home,T,sug:best}}
function tbHelp(inFill){const m=mnfInfo();if(!m)return '';const mu=m.home==='fav'?`${m.dog} @ ${m.fav}`:`${m.fav} @ ${m.dog}`;
 return `<div class="mute" style="margin-top:6px;font-size:13px">🏈 MNF ${mu} · market total <b>${m.T}</b> · suggest <b>${m.sug}</b> <span style="opacity:.8">(how games with this total most often finish, 10 seasons)</span>${inFill?` <button class="btn alt" style="padding:4px 10px;margin:0 0 0 6px" onclick="setTb(${m.sug});renderFill(true)">Use ${m.sug}</button>`:''}</div>`}
function renderFill(keepScroll){const y=scrollY,x=getFill(),off=official('BROOKS'),R=wkRows();

 const ser={BROOKS:C.BROOKS,STELLA:C.STELLA||[]},w4=[...Array(n).keys()].map(i=>kth(4,i)),w1=[...Array(n).keys()].map(i=>kth(1,i));
 const sty={you:{c:'#2563eb',w:3.5,d:''},stella:{c:'#db2777',w:2.5,d:'6 3'},lead:{c:'#475569',w:2,d:'2 3'},fourth:{c:'#d97706',w:2,d:'8 3 2 3'}};
 function chart(lines,zeroLbl,tag){const Wd=340,Hd=200,L=34,R=58,T=12,B=22,all=lines.flatMap(l=>l.v).concat([0]);let lo=Math.min(...all),hi=Math.max(...all);const pad=Math.max(2,(hi-lo)*.12);lo=Math.floor(lo-pad);hi=Math.ceil(hi+pad);
  const X=i=>L+i*(Wd-L-R)/Math.max(1,n-1),Y=v=>T+(hi-v)*(Hd-T-B)/(hi-lo);let g=`<svg viewBox="0 0 ${Wd} ${Hd}" width="100%" style="font:10px Arial">`;
  g+=`<rect x="${L}" y="${T}" width="${Wd-L-R}" height="${Y(0)-T}" fill="#16a34a" opacity=".08"/><rect x="${L}" y="${Y(0)}" width="${Wd-L-R}" height="${Hd-B-Y(0)}" fill="#dc2626" opacity=".06"/>`;
  const st=Math.max(1,Math.ceil((hi-lo)/6));for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st)g+=`<line x1="${L}" x2="${Wd-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#94a3b8" stroke-width="${v===0?1.5:.4}"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end" fill="currentColor">${v>0?'+':''}${v}</text>`;
  for(let i=0;i<n;i++)g+=`<text x="${X(i)}" y="${Hd-6}" text-anchor="middle" fill="currentColor">${i+1>=3?i+1:i+1}</text>`;
  const ends=[];lines.forEach(l=>{const s=sty[l.k];g+=`<polyline fill="none" stroke="${s.c}" stroke-width="${s.w}" stroke-dasharray="${s.d}" stroke-linejoin="round" points="${l.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
   l.v.forEach((v,i)=>{if(l.k==='you')g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${s.c}"/>`});ends.push({y:Y(l.v[n-1]),t:`${l.n} ${l.v[n-1]>0?'+':''}${l.v[n-1]}`,c:s.c})});
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<11)ends[i].y=ends[i-1].y+11;
  ends.forEach(e=>g+=`<text x="${Wd-R+4}" y="${e.y+3}" fill="${e.c}" font-weight="bold">${e.t}</text>`);return g+'</svg>'}
 const leg=ks=>`<div class="legend">${ks.map(([k,t])=>`<span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="${sty[k].c}" stroke-width="${sty[k].w}" stroke-dasharray="${sty[k].d}"/></svg>${t}</span>`).join('')}</div>`;
 const gap=a=>a.map((v,i)=>v-w4[i]);
 const L1=[{k:'lead',n:'1st',v:gap(w1)},{k:'you',n:'You',v:gap(ser.BROOKS)}];if(ser.STELLA.length)L1.push({k:'stella',n:'Stella',v:gap(ser.STELLA)});
 h+=`<div class="card"><h2>Gap to 4th (the money line)</h2><div class="mute">Above 0 = in a paying spot. Below = points you need to make up.</div>${chart(L1,'4th place','g4')}${leg([['you','You'],['stella','Stella'],['lead','Leader']])}</div>`;
 const pc=a=>a.map((v,i)=>Math.round((v-S.target*(i+1)/S.weeks)*10)/10);
 const L2=[{k:'lead',n:'1st',v:pc(w1)},{k:'fourth',n:'4th',v:pc(w4)},{k:'you',n:'You',v:pc(ser.BROOKS)}];if(ser.STELLA.length)L2.push({k:'stella',n:'Stella',v:pc(ser.STELLA)});
 h+=`<div class="card"><h2>Ahead / behind ${S.target} pace</h2><div class="mute">${S.target} pace = ${(S.target/S.weeks).toFixed(1)} a week. 0 = right on pace.</div>${chart(L2,S.target+' pace','pc')}${leg([['you','You'],['stella','Stella'],['lead','Leader'],['fourth','4th place']])}</div>`;
 const avg=[...Array(n).keys()].map(i=>{const a=names.map(x=>P[x][i]).filter(v=>v>0);return a.reduce((p,q)=>p+q,0)/a.length});
 {const Wd=340,Hd=190,L=24,T=10,B=22,mx=Math.max(12,...P.BROOKS,...(P.STELLA||[])),bw=(Wd-L-8)/n,Y=v=>T+(mx-v)*(Hd-T-B)/mx,hasS=!!P.STELLA;let g=`<svg viewBox="0 0 ${Wd} ${Hd}" width="100%" style="font:10px Arial">`;
  for(let v=0;v<=mx;v+=2)g+=`<line x1="${L}" x2="${Wd-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#94a3b8" stroke-width=".4"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end" fill="currentColor">${v}</text>`;
  for(let i=0;i<n;i++){const x0=L+i*bw+bw*.12,bwi=hasS?bw*.38:bw*.76,b=P.BROOKS[i];g+=`<rect x="${x0}" y="${Y(b)}" width="${bwi}" height="${Y(0)-Y(b)}" fill="#2563eb"/><text x="${x0+bwi/2}" y="${Y(b)-2}" text-anchor="middle" fill="currentColor" font-weight="bold">${b}</text>`;
   if(hasS){const sv=P.STELLA[i];g+=`<rect x="${x0+bwi}" y="${Y(sv)}" width="${bwi}" height="${Y(0)-Y(sv)}" fill="none" stroke="#db2777" stroke-width="1.5"/>`}
   g+=`<text x="${L+i*bw+bw/2}" y="${Hd-6}" text-anchor="middle" fill="currentColor">${i+1}</text>`}
  g+=`<polyline fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="2 3" points="${avg.map((v,i)=>(L+i*bw+bw/2)+','+Y(v)).join(' ')}"/>`;
  g+=`<line x1="${L}" x2="${Wd-8}" y1="${Y(+per)}" y2="${Y(+per)}" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 4"/><text x="${Wd-10}" y="${Y(+per)-4}" text-anchor="end" fill="#16a34a" font-weight="bold">need ${per}/wk</text></svg>`;
  h+=`<div class="card"><h2>Weekly scores</h2><div class="mute">Your week-by-week points vs the field average, and what you need from here to hit ${S.target}.</div>${g}<div class="legend"><span><i style="background:#2563eb"></i>You</span>${hasS?'<span><i style="background:none;border:1.5px solid #db2777"></i>Stella</span>':''}<span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#475569" stroke-width="2" stroke-dasharray="2 3"/></svg>Field avg</span><span><svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 4"/></svg>Need/wk</span></div></div>`}
 h+=`<div class="card"><h2>Leaderboard</h2><table><tr><th>#</th><th>Name</th><th class="c">Last wk</th><th class="c">Total</th></tr>${ord.map((x,i)=>`<tr ${x==='BROOKS'?'style="font-weight:700;color:var(--fav)"':x==='STELLA'?'style="font-weight:700;color:var(--dog)"':i===3?'style="border-bottom:2px solid var(--acc)"':''}><td>${i+1}</td><td>${x}</td><td class="c">${P[x][n-1]}</td><td class="c">${tot(x)}</td></tr>`).join('')}</table><div class="mute" style="margin-top:6px">${S.asOf}. Paying spots: top 4.</div></div>`;
 $('#race').innerHTML=h}

/* ---------- History ---------- */
function renderHistory(){const wk=[...new Set(G.map(g=>+g.week))].sort((a,b)=>b-a),sel=LS.get('hweek',wk[0]);
 $('#history').innerHTML=`<div class="card"><h2>Week history</h2><select id="wsel">${wk.map(w=>`<option value="${w}" ${w==sel?'selected':''}>Week ${w}</option>`).join('')}</select></div><div id="wout"></div>`;
 const show=w=>{LS.set('hweek',w);const R=G.filter(g=>+g.week===w);let bw=0,bl=0,sw=0,sl=0;
  const rows=R.map(g=>{const cov=g.result==='fav covered'?g.favorite:g.result==='dog covered'?g.underdog:'—',bp=g.brooks_pick==='fav'?g.favorite:g.brooks_pick==='dog'?g.underdog:'',sp=g.stella_pick==='fav'?g.favorite:g.stella_pick==='dog'?g.underdog:'';
   if(g.brooks_correct==='Y')bw++;if(g.brooks_correct==='N')bl++;if(g.stella_correct==='Y')sw++;if(g.stella_correct==='N')sl++;const mk=c=>c==='Y'?' <span class="ok">✓</span>':c==='N'?' <span class="x">✗</span>':'';
   const sc=g.fav_score?` · ${g.fav_score}-${g.dog_score}`:'';
   return `<tr><td>${g.favorite} -${g.pool_line}<div class="mute">${g.home==='dog'?'@ ':'vs '}${g.underdog}${sc}</div></td><td class="c"><span class="chip ${g.result==='fav covered'?'cf':g.result==='dog covered'?'cd':''}">${cov}</span></td><td class="c">${bp}${mk(g.brooks_correct)}</td><td class="c">${sp}${mk(g.stella_correct)}</td></tr>`});
  $('#wout').innerHTML=`<div class="card big"><div><span class="mute">Brooks</span><b>${bw+bl?bw+'-'+bl:'–'}</b></div><div><span class="mute">Stella</span><b>${sw+sl?sw+'-'+sl:'–'}</b></div><div><span class="mute">Favs covered</span><b>${R.filter(g=>g.result==='fav covered').length}</b></div></div>
  <div class="card"><table><tr><th>Game (pool line)</th><th class="c">Covered</th><th class="c">Brooks</th><th class="c">Stella</th></tr>${rows.join('')}</table></div>`};
 $('#wsel').onchange=e=>show(+e.target.value);show(+sel)}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go(TABS.includes(tab)?tab:'week');
load().catch(()=>{$('#week').innerHTML='<div class="card">Couldn’t load data. Pull down to refresh.</div>'});
</script>
